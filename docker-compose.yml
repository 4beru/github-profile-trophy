services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  trophy-app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      PORT: "8080"
      ENABLE_REDIS: "true"
      REDIS_HOST: redis
      GITHUB_TOKEN1: ${GITHUB_TOKEN1}
      GITHUB_TOKEN2: ${GITHUB_TOKEN2:-}
