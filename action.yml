name: Generate GitHub Profile Trophy SVG
description: Generate a trophy SVG using Node.js.
inputs:
  username:
    description: GitHub username
    required: true
  output_path:
    description: Output path
    required: true
    default: trophy.svg
  token:
    description: GitHub API token
    required: true
  theme:
    description: Theme
    required: false
    default: default
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install generator dependencies
      shell: bash
      run: npm install --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund
    - name: Generate trophy
      shell: bash
      env:
        GITHUB_TOKEN1: ${{ inputs.token }}
        TROPHY_USERNAME: ${{ inputs.username }}
        TROPHY_OUTPUT: ${{ inputs.output_path }}
        TROPHY_THEME: ${{ inputs.theme }}
      run: |
        output="$TROPHY_OUTPUT"
        if [[ "$output" != /* ]]; then output="$GITHUB_WORKSPACE/$output"; fi
        cd "$GITHUB_ACTION_PATH"
        ./node_modules/.bin/tsx render_svg.ts "$TROPHY_USERNAME" "$output" "$TROPHY_THEME"
